name: quest_key
description: "A new Flutter project."
publish_to: 'none'
# Play release versioning: versionName+versionCode. Bump the +N for every
# upload to the Play Console (it must strictly increase).
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  popup_card: ^0.1.0
  provider: ^6.1.4
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.1.0
  flutter_timezone: ^4.1.0
  timezone: ^0.10.1
  intl: ^0.20.2
  rive: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icon generation. Run `dart run flutter_launcher_icons` ONLY after
# the source images exist (see assets/icon/README.md):
#   assets/icon/app_icon.png            1024x1024, full-bleed legacy icon
#   assets/icon/app_icon_foreground.png 1024x1024, transparent background,
#                                       artwork inside the centre 66% safe zone
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1D113E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Bundled typefaces (SIL Open Font License, see assets/fonts/OFL-*.txt).
  # Cinzel: display/headings. Spectral: body text.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Italic.ttf
          style: italic
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Spectral-Bold.ttf
          weight: 700

  # TODO(assets): The image files are NOT in the repository yet. The three
  # directories below exist only as `.gitkeep` placeholders so the build can
  # resolve the declarations. Copy the real `assets/images/*` folders in from
  # the developer's local machine and commit them. The complete list of files
  # the code expects is in `assets/REQUIRED_ASSETS.md`.
  assets:
    - assets/images/app_assets/
    - assets/images/character_images/
    - assets/images/class_images/
    # Optional sprite strips for familiars (see assets/REQUIRED_ASSETS.md).
    - assets/images/familiars/
